===================================================== */

<script>

/* =====================================================
   データ読み込み
===================================================== */

let schedules =
    JSON.parse(
        localStorage.getItem("schedules")
        || "[]"
    );

let todos =
    JSON.parse(
        localStorage.getItem("todos")
        || "[]"
    );


/* =====================================================
   現在の月
===================================================== */

let currentMonth =
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    );


/* =====================================================
   選択日
===================================================== */

let selectedDate =
    new Date();


/* =====================================================
   モーダル表示ロック
   2回タップなどで二重表示されるのを防ぐ
===================================================== */

let openingDateModal = false;


/* =====================================================
   データ保存
===================================================== */

function saveData() {

    localStorage.setItem(
        "schedules",
        JSON.stringify(schedules)
    );

    localStorage.setItem(
        "todos",
        JSON.stringify(todos)
    );
}


/* =====================================================
   ID生成
===================================================== */

function createId() {

    return (
        Date.now()
        +
        Math.floor(
            Math.random() * 100000
        )
    );
}


/* =====================================================
   日付キー
===================================================== */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


/* =====================================================
   予定・Todoの日付判定
===================================================== */

function isDate(item, date) {

    const start =
        new Date(
            item.year,
            item.month - 1,
            item.day
        );

    /*
       開始日より前は表示しない
    */

    if (
        date < start
    ) {

        return false;
    }


    switch (item.repeat) {


        case "DAILY":

            return true;


        case "WEEKLY":

            return (
                date.getDay()
                === start.getDay()
            );


        case "MONTHLY":

            return (
                date.getDate()
                === start.getDate()
            );


        default:

            return (
                dateKey(date)
                === dateKey(start)
            );
    }
}


/* =====================================================
   日本の祝日
===================================================== */

function getJapaneseHolidays(year) {

    const holidays = {};


    function add(
        month,
        day,
        name
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );

        holidays[
            dateKey(date)
        ] = name;
    }


    /*
       第n月曜日
    */

    function nthMonday(
        month,
        nth
    ) {

        const first =
            new Date(
                year,
                month - 1,
                1
            );

        const firstDay =
            first.getDay();

        const day =
            1
            +
            ((8 - firstDay) % 7)
            +
            (nth - 1) * 7;

        return new Date(
            year,
            month - 1,
            day
        );
    }


    /*
       1980～2099年程度の
       春分・秋分計算
    */

    function springEquinox(year) {

        return Math.floor(
            20.8431
            +
            0.242194 *
            (year - 1980)
            -
            Math.floor(
                (year - 1980) / 4
            )
        );
    }


    function autumnEquinox(year) {

        return Math.floor(
            23.2488
            +
            0.242194 *
            (year - 1980)
            -
            Math.floor(
                (year - 1980) / 4
            )
        );
    }


    /*
       元日
    */

    add(
        1,
        1,
        "元日"
    );


    /*
       成人の日
    */

    const comingOfAge =
        nthMonday(
            1,
            2
        );

    holidays[
        dateKey(comingOfAge)
    ] =
        "成人の日";


    /*
       建国記念の日
    */

    add(
        2,
        11,
        "建国記念の日"
    );


    /*
       天皇誕生日
    */

    if (
        year >= 2020
    ) {

        add(
            2,
            23,
            "天皇誕生日"
        );
    }


    /*
       春分の日
    */

    add(
        3,
        springEquinox(year),
        "春分の日"
    );


    /*
       昭和の日
    */

    add(
        4,
        29,
        "昭和の日"
    );


    /*
       憲法記念日
    */

    add(
        5,
        3,
        "憲法記念日"
    );


    /*
       みどりの日
    */

    add(
        5,
        4,
        "みどりの日"
    );


    /*
       こどもの日
    */

    add(
        5,
        5,
        "こどもの日"
    );


    /*
       海の日
    */

    const marine =
        nthMonday(
            7,
            3
        );

    holidays[
        dateKey(marine)
    ] =
        "海の日";


    /*
       山の日
    */

    add(
        8,
        11,
        "山の日"
    );


    /*
       敬老の日
    */

    const respect =
        nthMonday(
            9,
            3
        );

    holidays[
        dateKey(respect)
    ] =
        "敬老の日";


    /*
       秋分の日
    */

    add(
        9,
        autumnEquinox(year),
        "秋分の日"
    );


    /*
       スポーツの日
    */

    const sports =
        nthMonday(
            10,
            2
        );

    holidays[
        dateKey(sports)
    ] =
        "スポーツの日";


    /*
       文化の日
    */

    add(
        11,
        3,
        "文化の日"
    );


    /*
       勤労感謝の日
    */

    add(
        11,
        23,
        "勤労感謝の日"
    );


    /*
       国民の休日

       祝日と祝日の間にある
       平日は休日になる。
    */

    const holidayKeys =
        Object.keys(holidays);


    for (
        let month = 1;
        month <= 12;
        month++
    ) {

        const days =
            new Date(
                year,
                month,
                0
            ).getDate();

        for (
            let day = 1;
            day <= days;
            day++
        ) {

            const date =
                new Date(
                    year,
                    month - 1,
                    day
                );

            if (
                date.getDay() === 0
                ||
                date.getDay() === 6
            ) {

                continue;
            }


            const previous =
                new Date(date);

            previous.setDate(
                previous.getDate() - 1
            );


            const next =
                new Date(date);

            next.setDate(
                next.getDate() + 1
            );


            if (
                holidays[
                    dateKey(previous)
                ]
                &&
                holidays[
                    dateKey(next)
                ]
            ) {

                holidays[
                    dateKey(date)
                ] =
                    "国民の休日";
            }
        }
    }


    /*
       振替休日

       日曜日に祝日が重なった場合、
       次の祝日ではない平日を
       振替休日にする。
    */

    const originalHolidays =
        Object.keys(holidays)
            .map(
                key => ({
                    key,
                    name:
                        holidays[key]
                })
            );


    for (
        const holiday
        of originalHolidays
    ) {

        const parts =
            holiday.key.split("-");


        const date =
            new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2])
            );


        if (
            date.getDay() !== 0
        ) {

            continue;
        }


        let substitute =
            new Date(date);


        substitute.setDate(
            substitute.getDate() + 1
        );


        while (
            holidays[
                dateKey(substitute)
            ]
        ) {

            substitute.setDate(
                substitute.getDate() + 1
            );
        }


        holidays[
            dateKey(substitute)
        ] =
            "振替休日";
    }


    return holidays;
}


/* =====================================================
   カレンダー表示
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    document.getElementById(
        "monthButton"
    ).textContent =
        `${year}年${month + 1}月`;


    const first =
        new Date(
            year,
            month,
            1
        );


    const startDay =
        first.getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const holidays =
        getJapaneseHolidays(
            year
        );


    /*
       42マス
    */

    for (
        let i = 0;
        i < 42;
        i++
    ) {

        const dayNumber =
            i - startDay + 1;


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const thisMonth =
            date.getMonth()
            === month;


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day-cell";


        if (
            !thisMonth
        ) {

            cell.classList.add(
                "other-month"
            );
        }


        /*
           今日
        */

        if (
            dateKey(date)
            === dateKey(
                new Date()
            )
        ) {

            cell.classList.add(
                "today"
            );
        }


        /*
           日付
        */

        const dayText =
            document.createElement(
                "div"
            );


        dayText.className =
            "day-number";


        dayText.textContent =
            date.getDate();


        /*
           前月・翌月は必ず灰色
        */

        if (
            !thisMonth
        ) {

            dayText.style.color =
                "#BDBDBD";

        } else if (
            holidays[
                dateKey(date)
            ]
            ||
            date.getDay() === 0
        ) {

            dayText.style.color =
                "#F44336";

        } else if (
            date.getDay() === 6
        ) {

            dayText.style.color =
                "#1976D2";

        } else {

            dayText.style.color =
                "#333";
        }


        cell.appendChild(
            dayText
        );


        /*
           祝日名

           当月だけ表示
        */

        if (
            thisMonth
            &&
            holidays[
                dateKey(date)
            ]
        ) {

            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "schedule-preview holiday";


            holiday.textContent =
                holidays[
                    dateKey(date)
                ];


            cell.appendChild(
                holiday
            );
        }


        /*
           予定＋Todo
        */

        const items = [];


        /*
           予定
        */

        for (
            const schedule
            of schedules
        ) {

            if (
                isDate(
                    schedule,
                    date
                )
            ) {

                items.push({

                    type:
                        "schedule",

                    item:
                        schedule
                });
            }
        }


        /*
           Todo
        */

        for (
            const todo
            of todos
        ) {

            if (
                isDate(
                    todo,
                    date
                )
            ) {

                items.push({

                    type:
                        "todo",

                    item:
                        todo
                });
            }
        }


        /*
           4件までは4件表示

           5件以上なら

           3件
           ＋
           他○件
        */

        const displayCount =
            items.length >= 5
                ? 3
                : Math.min(
                    items.length,
                    4
                );


        for (
            let j = 0;
            j < displayCount;
            j++
        ) {

            const data =
                items[j];


            const text =
                document.createElement(
                    "div"
                );


            if (
                data.type
                === "schedule"
            ) {

                text.className =
                    "schedule-preview";


                /*
                   予定の左に○を付けない
                */

                text.textContent =
                    data.item.title;

            } else {

                text.className =
                    "todo-preview";


                const completed =
                    isTodoCompleted(
                        data.item,
                        date
                    );


                text.textContent =
                    (
                        completed
                            ? "✓ "
                            : "□ "
                    )
                    +
                    data.item.title;


                if (
                    completed
                ) {

                    text.classList.add(
                        "completed"
                    );
                }
            }


            cell.appendChild(
                text
            );
        }


        /*
           5件以上
        */

        if (
            items.length >= 5
        ) {

            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =
                `…他${items.length - 3}件`;


            cell.appendChild(
                more
            );
        }


        /*
           日付クリック

           二重タップ・二重表示防止
        */

        cell.addEventListener(
            "click",
            event => {

                event.preventDefault();


                if (
                    openingDateModal
                ) {

                    return;
                }


                if (
                    document
                        .getElementById(
                            "dateModal"
                        )
                        .classList
                        .contains(
                            "show"
                        )
                ) {

                    return;
                }


                openingDateModal =
                    true;


                selectedDate =
                    new Date(date);


                showDateModal();


                setTimeout(
                    () => {

                        openingDateModal =
                            false;

                    },
                    300
                );
            }
        );


        calendar.appendChild(
            cell
        );
    }
}


/* =====================================================
   Todo完了状態
===================================================== */

function isTodoCompleted(
    todo,
    date
) {

    if (
        todo.repeat
        === "NONE"
    ) {

        return !!todo.completed;
    }


    return (
        todo.completedDates
        || []
    ).includes(
        dateKey(date)
    );
}


/* =====================================================
   Todo完了設定
===================================================== */

function setTodoCompleted(
    todo,
    date,
    completed
) {

    if (
        todo.repeat
        === "NONE"
    ) {

        todo.completed =
            completed;

        return;
    }


    if (
        !todo.completedDates
    ) {

        todo.completedDates =
            [];
    }


    const key =
        dateKey(date);


    const index =
        todo.completedDates
            .indexOf(key);


    if (
        completed
        &&
        index === -1
    ) {

        todo.completedDates.push(
            key
        );

    } else if (
        !completed
        &&
        index !== -1
    ) {

        todo.completedDates.splice(
            index,
            1
        );
    }
}

/* =====================================================
   予定編集
===================================================== */

function editSchedule(
    index
) {

    const schedule =
        schedules[index];


    const title =
        prompt(
            "予定を編集",
            schedule.title
        );


    if (
        title === null
    ) {

        return;
    }


    const newTitle =
        title.trim();


    if (
        newTitle === ""
    ) {

        return;
    }


    schedule.title =
        newTitle;


    const repeat =
        prompt(
            "繰り返しを入力してください\n"
            +
            "NONE / DAILY / WEEKLY / MONTHLY",
            schedule.repeat
        );


    if (
        repeat
        &&
        [
            "NONE",
            "DAILY",
            "WEEKLY",
            "MONTHLY"
        ].includes(
            repeat.toUpperCase()
        )
    ) {

        schedule.repeat =
            repeat.toUpperCase();
    }


    saveData();


    showDateModal();


    renderCalendar();
}

/* =====================================================
   左右スワイプ
===================================================== */

let touchStartX =
    0;

let touchStartY =
    0;

let touchStartTime =
    0;


const calendar =
    document.getElementById(
        "calendar"
    );


calendar.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) {

            return;
        }


        touchStartX =
            event.changedTouches[0]
                .screenX;


        touchStartY =
            event.changedTouches[0]
                .screenY;


        touchStartTime =
            Date.now();
    },
    {
        passive: true
    }
);


calendar.addEventListener(
    "touchend",
    event => {

        if (
            event.changedTouches.length !== 1
        ) {

            return;
        }


        const endX =
            event.changedTouches[0]
                .screenX;


        const endY =
            event.changedTouches[0]
                .screenY;


        const dx =
            endX - touchStartX;


        const dy =
            endY - touchStartY;


        const duration =
            Date.now()
            -
            touchStartTime;


        /*
           横方向に60px以上、
           縦より横の移動が大きい場合
        */

        if (
            Math.abs(dx) > 60
            &&
            Math.abs(dx)
                > Math.abs(dy)
            &&
            duration < 700
        ) {

            if (
                dx < 0
            ) {

                currentMonth =
                    new Date(
                        currentMonth.getFullYear(),
                        currentMonth.getMonth()
                        + 1,
                        1
                    );

            } else {

                currentMonth =
                    new Date(
                        currentMonth.getFullYear(),
                        currentMonth.getMonth()
                        - 1,
                        1
                    );
            }


            renderCalendar();
        }
    },
    {
        passive: true
    }
);


/* =====================================================
   日付詳細から追加
===================================================== */

document
    .getElementById(
        "modalAddButton"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "dateModal"
                )
                .classList.remove(
                    "show"
                );


            showAddScreen();
        }
    );


/* =====================================================
   戻る
===================================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        hideAddScreen
    );


/* =====================================================
   日付モーダルを閉じる
===================================================== */

document
    .getElementById(
        "dateModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id
                === "dateModal"
            ) {

                event.target
                    .classList.remove(
                        "show"
                    );
            }
        }
    );


/* =====================================================
   年月選択
===================================================== */

const yearMonthModal =
    document.getElementById(
        "yearMonthModal"
    );


document
    .getElementById(
        "monthButton"
    )
    .addEventListener(
        "click",
        showYearMonthPicker
    );


function showYearMonthPicker() {

    yearMonthModal
        .classList.add(
            "show"
        );


    updateYearMonthPicker();
}


function updateYearMonthPicker() {

    document.getElementById(
        "yearText"
    ).textContent =
        `${currentMonth.getFullYear()}年`;


    const grid =
        document.getElementById(
            "monthGrid"
        );


    grid.innerHTML =
        "";


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.textContent =
            `${month + 1}月`;


        if (
            month
            ===
            currentMonth.getMonth()
        ) {

            button.classList.add(
                "selected"
            );
        }


        button.onclick =
            () => {

                currentMonth =
                    new Date(
                        currentMonth.getFullYear(),
                        month,
                        1
                    );


                yearMonthModal
                    .classList.remove(
                        "show"
                    );


                renderCalendar();
            };


        grid.appendChild(
            button
        );
    }
}


/* =====================================================
   前年
===================================================== */

document
    .getElementById(
        "previousYear"
    )
    .addEventListener(
        "click",
        () => {

            currentMonth =
                new Date(
                    currentMonth.getFullYear()
                    - 1,
                    currentMonth.getMonth(),
                    1
                );


            updateYearMonthPicker();
        }
    );


/* =====================================================
   次年
===================================================== */

document
    .getElementById(
        "nextYear"
    )
    .addEventListener(
        "click",
        () => {

            currentMonth =
                new Date(
                    currentMonth.getFullYear()
                    + 1,
                    currentMonth.getMonth(),
                    1
                );


            updateYearMonthPicker();
        }
    );


/* =====================================================
   年月選択を閉じる
===================================================== */

yearMonthModal.addEventListener(
    "click",
    event => {

        if (
            event.target
            ===
            yearMonthModal
        ) {

            yearMonthModal
                .classList.remove(
                    "show"
                );
        }
    }
);


/* =====================================================
   ESCでモーダルを閉じる
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key
            ===
            "Escape"
        ) {

            document
                .getElementById(
                    "dateModal"
                )
                .classList.remove(
                    "show"
                );


            document
                .getElementById(
                    "yearMonthModal"
                )
                .classList.remove(
                    "show"
                );


            hideAddScreen();
        }
    }
);


/* =====================================================
   初期表示
===================================================== */

renderCalendar();

</script>

</body>

</html>
