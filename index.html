<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#405de6">

<title>カレンダー</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: #f5f6fa;
    color: #333;

    overflow: hidden;
}

button,
input,
select {
    font: inherit;
}


/* =========================================
   アプリ全体
========================================= */

.app {
    width: 100%;
    height: 100dvh;

    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #f5f6fa;
}


/* =========================================
   ヘッダー
========================================= */

.header {
    width: 100%;
    height: 58px;

    flex: 0 0 58px;

    display: flex;
    align-items: center;

    background: #405de6;
    color: white;
}

.month-arrow {
    width: 55px;
    height: 58px;

    flex: 0 0 55px;

    border: none;
    background: transparent;

    color: white;

    font-size: 32px;
    line-height: 1;

    cursor: pointer;

    display: flex;
    justify-content: center;
    align-items: center;
}

.month-button {
    flex: 1;

    width: 0;
    height: 58px;

    border: none;
    background: transparent;

    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}


/* =========================================
   曜日
========================================= */

.week-header {
    width: 100%;
    height: 36px;

    flex: 0 0 36px;

    display: grid;
    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    background: white;

    border-bottom: 1px solid #ddd;
}

.week-header div {
    min-width: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 14px;
    font-weight: bold;
}

.sunday {
    color: #f44336;
}

.saturday {
    color: #1976d2;
}


/* =========================================
   カレンダー
========================================= */

.calendar {
    width: 100%;

    flex: 1 1 auto;

    min-height: 0;

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    grid-template-rows:
        repeat(6, minmax(0, 1fr));

    gap: 1px;

    background: #d0d0d0;

    padding: 1px;

    touch-action: pan-y;
}


/* =========================================
   日付マス
========================================= */

.day-cell {
    position: relative;

    min-width: 0;
    min-height: 0;

    background: white;

    padding: clamp(2px, 0.4vw, 5px);

    overflow: hidden;

    display: flex;
    flex-direction: column;

    cursor: pointer;

    user-select: none;
}

.day-cell:active {
    background: #eef1ff;
}

.day-cell.today {
    background: #ebf0ff;
}


/* =========================================
   日付
========================================= */

.day-number {
    width: 100%;
    height: clamp(18px, 3vh, 24px);

    flex: 0 0 auto;

    font-size: clamp(11px, 1.5vw, 15px);

    font-weight: bold;

    line-height: 1.4;
}

.other-month .day-number {
    color: #bbb;
}

.holiday {
    color: #f44336 !important;
}


/* =========================================
   予定・Todo
========================================= */

.schedule-preview,
.todo-preview {
    width: 100%;

    height: clamp(13px, 2.1vh, 17px);

    flex: 0 0 auto;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: clamp(8px, 1.15vw, 11px);

    line-height: clamp(13px, 2.1vh, 17px);
}

.schedule-preview {
    color: #405de6;
}

.todo-preview {
    color: #444;
}

.completed {
    text-decoration: line-through;
    color: #999;
}

.more {
    width: 100%;

    height: clamp(13px, 2.1vh, 17px);

    flex: 0 0 auto;

    overflow: hidden;

    white-space: nowrap;

    color: #777;

    font-size: clamp(7px, 1vw, 10px);

    line-height: clamp(13px, 2.1vh, 17px);
}


/* =========================================
   下部
========================================= */

.bottom {
    width: 100%;

    height: 70px;

    flex: 0 0 70px;

    display: flex;

    justify-content: flex-end;
    align-items: center;

    padding:
        5px
        max(12px, env(safe-area-inset-right))
        5px
        max(12px, env(safe-area-inset-left));

    background: white;

    box-shadow:
        0 -2px 8px rgba(0,0,0,.08);

    z-index: 10;
}

.add-button {
    width: 60px;
    height: 60px;

    flex: 0 0 60px;

    border: none;
    border-radius: 50%;

    background: #405de6;

    color: white;

    font-size: 30px;

    display: flex;

        0 3px 8px rgba(0,0,0,.2);
}


/* =========================================
   日付モーダル
========================================= */

.modal-background {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    justify-content: center;
    align-items: flex-end;

}

.modal-background.show {

}

.bottom-sheet {

    max-width: 700px;

    max-height: 82dvh;

    background: #f5f6fa;

    border-radius:
        20px 20px 0 0;

        10px
        15px
        max(20px, env(safe-area-inset-bottom));

    overflow-y: auto;

    animation:
        slideUp .2s ease;
}

@keyframes slideUp {

    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.handle {

}

.sheet-title {

        8px 3px 15px;

.section-title {

}

<script>

/* =========================================
   データ
========================================= */

let schedules =
    JSON.parse(
        localStorage.getItem(
            "schedules"
        ) || "[]"
    );

let todos =
    JSON.parse(
        localStorage.getItem(
            "todos"
        ) || "[]"
    );


let currentMonth =
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    );


let selectedDate =
    new Date();


/* =========================================
   保存
========================================= */

function saveData() {

    localStorage.setItem(
        "schedules",
        JSON.stringify(schedules)
    );

    localStorage.setItem(
        "todos",
        JSON.stringify(todos)
    );
}


/* =========================================
   ID
========================================= */

function createId() {

    return Date.now()
        + Math.floor(
            Math.random() * 100000
        );
}


/* =========================================
   日付キー
========================================= */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


/* =========================================
   予定の日付判定
========================================= */

function isDate(item, date) {

    const start =
        new Date(
            item.year,
            item.month - 1,
            item.day
        );

    if (date < start) {
        return false;
    }


    switch (item.repeat) {

        case "DAILY":
            return true;

        case "WEEKLY":
            return (
                date.getDay()
                === start.getDay()
            );

        case "MONTHLY":
            return (
                date.getDate()
                === start.getDate()
            );

        default:

            return (
                dateKey(date)
                === dateKey(start)
            );
    }
}


/* =========================================
   日本の祝日
========================================= */

function getJapaneseHolidays(year) {

    const holidays = {};


    function add(
        month,
        day,
        name
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );

        holidays[
            dateKey(date)
        ] = name;
    }


    function nthMonday(
        month,
        nth
    ) {

        const first =
            new Date(
                year,
                month - 1,
                1
            );

        const firstDay =
            first.getDay();

        const day =
            1
            + ((8 - firstDay) % 7)
            + (nth - 1) * 7;

        return new Date(
            year,
            month - 1,
            day
        );
    }


    add(1, 1, "元日");


    const comingOfAge =
        nthMonday(1, 2);

    holidays[
        dateKey(comingOfAge)
    ] = "成人の日";


    add(
        2,
        11,
        "建国記念の日"
    );

    add(
        2,
        23,
        "天皇誕生日"
    );


    const springDay =
        Math.floor(
            20.8431
            + 0.242194
            * (year - 1980)
            - Math.floor(
                (year - 1980) / 4
            )
        );

    add(
        3,
        springDay,
        "春分の日"
    );


    add(
        4,
        29,
        "昭和の日"
    );

    add(
        5,
        3,
        "憲法記念日"
    );

    add(
        5,
        4,
        "みどりの日"
    );

    add(
        5,
        5,
        "こどもの日"
    );


    const marine =
        nthMonday(7, 3);

    holidays[
        dateKey(marine)
    ] = "海の日";


    add(
        8,
        11,
        "山の日"
    );


    const respect =
        nthMonday(9, 3);

    holidays[
        dateKey(respect)
    ] = "敬老の日";


    const autumnDay =
        Math.floor(
            23.2488
            + 0.242194
            * (year - 1980)
            - Math.floor(
                (year - 1980) / 4
            )
        );

    add(
        9,
        autumnDay,
        "秋分の日"
    );


    const sports =
        nthMonday(10, 2);

    holidays[
        dateKey(sports)
    ] = "スポーツの日";


    add(
        11,
        3,
        "文化の日"
    );

    add(
        11,
        23,
        "勤労感謝の日"
    );


    /* 振替休日 */

    const original =
        Object.keys(holidays)
            .map(key => ({
                key,
                name:
                    holidays[key]
            }));


    for (
        const holiday of original
    ) {

        const parts =
            holiday.key.split("-");


        const date =
            new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2])
            );


        if (
            date.getDay() === 0
        ) {

            let substitute =
                new Date(date);


            substitute.setDate(
                substitute.getDate() + 1
            );


            while (
                holidays[
                    dateKey(substitute)
                ]
            ) {

                substitute.setDate(
                    substitute.getDate() + 1
                );
            }


            holidays[
                dateKey(substitute)
            ] =
                "振替休日";
        }
    }


    return holidays;
}


/* =========================================
   カレンダー
========================================= */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();


    document.getElementById(
        "monthButton"
    ).textContent =
        `${year}年${month + 1}月`;


    const first =
        new Date(
            year,
            month,
            1
        );


    const startDay =
        first.getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const holidays =
        getJapaneseHolidays(
            year
        );


    for (
        let i = 0;
        i < 42;
        i++
    ) {

        const dayNumber =
            i - startDay + 1;


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const thisMonth =
            dayNumber >= 1
            && dayNumber <= daysInMonth;


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day-cell";


        if (!thisMonth) {

            cell.classList.add(
                "other-month"
            );
        }


        /* 今日 */

        if (
            dateKey(date)
            === dateKey(
                new Date()
            )
        ) {

            cell.classList.add(
                "today"
            );
        }


        /* 日付 */

        const dayText =
            document.createElement(
                "div"
            );


        dayText.className =
            "day-number";


        dayText.textContent =
            date.getDate();


        if (
            date.getDay() === 0
            || holidays[
                dateKey(date)
            ]
        ) {

            dayText.classList.add(
                "holiday"
            );

        } else if (
            date.getDay() === 6
        ) {

            dayText.style.color =
                "#1976d2";
        }


        cell.appendChild(
            dayText
        );


        /* 祝日 */

        if (
            thisMonth
            && holidays[
                dateKey(date)
            ]
        ) {

            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "schedule-preview holiday";


            holiday.textContent =
                holidays[
                    dateKey(date)
                ];


            cell.appendChild(
                holiday
            );
        }


        /* 項目 */

        const items = [];


        schedules.forEach(
            schedule => {

                if (
                    isDate(
                        schedule,
                        date
                    )
                ) {

                    items.push({
                        type:
                            "schedule",

                        item:
                            schedule
                    });
                }
            }
        );


        todos.forEach(
            todo => {

                if (
                    isDate(
                        todo,
                        date
                    )
                ) {

                    items.push({
                        type:
                            "todo",

                        item:
                            todo
                    });
                }
            }
        );


        /*
           4件以下
           → 4件表示

           5件以上
           → 3件表示
           → 他○件
        */

        const displayCount =
            items.length >= 5
                ? 3
                : Math.min(
                    items.length,
                    4
                );


        for (
            let j = 0;
            j < displayCount;
            j++
        ) {

            const data =
                items[j];


            const text =
                document.createElement(
                    "div"
                );


            if (
                data.type
                === "schedule"
            ) {

                text.className =
                    "schedule-preview";


                /*
                   予定の左側に
                   ○を表示しない
                */

                text.textContent =
                    data.item.title;

            } else {

                text.className =
                    "todo-preview";


                const completed =
                    isTodoCompleted(
                        data.item,
                        date
                    );


                text.textContent =
                    (
                        completed
                            ? "✓ "
                            : "□ "
                    )
                    + data.item.title;


                if (completed) {

                    text.classList.add(
                        "completed"
                    );
                }
            }


            cell.appendChild(
                text
            );
        }


        if (
            items.length >= 5
        ) {

            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =
                `…他${items.length - 3}件`;


            cell.appendChild(
                more
            );
        }


        /* 日付クリック */

        cell.addEventListener(
            "click",
            () => {

                selectedDate =
                    new Date(date);

                showDateModal();
            }
        );


        calendar.appendChild(
            cell
        );
    }
}


/* =========================================
   Todo完了
========================================= */

function isTodoCompleted(
    todo,
    date
) {

    if (
        todo.repeat === "NONE"
    ) {

        return !!todo.completed;
    }


    return (
        todo.completedDates
        || []
    ).includes(
        dateKey(date)
    );
}


function setTodoCompleted(
    todo,
    date,
    completed
) {

    if (
        todo.repeat === "NONE"
    ) {

        todo.completed =
            completed;

        return;
    }


    if (
        !todo.completedDates
    ) {

        todo.completedDates = [];
    }


    const key =
        dateKey(date);


    const index =
        todo.completedDates
            .indexOf(key);


    if (
        completed
        && index === -1
    ) {

        todo.completedDates.push(
            key
        );

    } else if (
        !completed
        && index !== -1
    ) {

        todo.completedDates.splice(
            index,
            1
        );
    }
}


/* =========================================

function showDateModal() {

    const modal =
        document.getElementById(

    document.getElementById(

            "scheduleList"
        );


    const todoList =
        document.getElementById(
            "todoList"
        );


    scheduleList.innerHTML = "";
    todoList.innerHTML = "";


    let scheduleCount = 0;


    schedules.forEach(
        (schedule, index) => {

            if (
                !isDate(
                    schedule,
                    selectedDate
                )
            ) {

                return;
            }


            scheduleCount++;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "item-row";


            const title =
                document.createElement(
                    "div"
                );

            title.textContent =

            const edit =

            edit.textContent =

            edit.onclick =

                    );


            const del =

                );


            del.className =
                "delete-button";


            del.textContent =

            del.onclick =
                () =>
                    deleteSchedule(
                        index
                    );


            row.appendChild(title);
            row.appendChild(edit);
            row.appendChild(del);


            scheduleList.appendChild(
                row
            );
        }
    );


    if (
        scheduleCount === 0
    ) {

        scheduleList.innerHTML =
            `<div class="empty">
                予定はありません
            </div>`;
    }


    let todoCount = 0;


    todos.forEach(
        (todo, index) => {

            if (
                !isDate(
                    todo,
                    selectedDate
                )
            ) {

                return;
            }


            todoCount++;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "item-row";


            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.className =
                "todo-check";


            check.checked =
                isTodoCompleted(
                    todo,
                    selectedDate
                );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "item-title";


            title.textContent =
                todo.title;


            if (
                check.checked
            ) {

                title.classList.add(
                    "todo-completed"
                );
            }


            check.onchange =
                () => {

                    setTodoCompleted(
                        todo,
                        selectedDate,
                        check.checked
                    );


                    saveData();

                    showDateModal();

                    renderCalendar();
                };


            const edit =
                document.createElement(
                    "button"
                );


            edit.className =
                "edit-button";


            edit.textContent =
                "編集";


            edit.onclick =
                () =>
                    editTodo(index);


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "delete-button";


            del.textContent =
                "削除";


            del.onclick =
                () =>
                    deleteTodo(index);


            row.appendChild(check);
            row.appendChild(title);
            row.appendChild(edit);
            row.appendChild(del);


            todoList.appendChild(
                row
            );
        }
    );


    if (
        todoCount === 0
    ) {

        todoList.innerHTML =
            `<div class="empty">
                Todoはありません
            </div>`;
    }


    modal.classList.add(
        "show"
    );
}

) {

    renderCalendar();

/* =========================================
   スワイプ
========================================= */

let touchStartX = 0;
let touchStartY = 0;


const calendar =
    document.getElementById(
        "calendar"
    );


calendar.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0]
                .screenX;

        touchStartY =
            event.changedTouches[0]
                .screenY;
    },
    {
        passive: true
    }
);


calendar.addEventListener(
    "touchend",
    event => {

        const endX =
            event.changedTouches[0]
                .screenX;

        const endY =
            event.changedTouches[0]
                .screenY;


        const dx =
            endX - touchStartX;

        const dy =
            endY - touchStartY;


        if (
            Math.abs(dx) > 60
            && Math.abs(dx)
                > Math.abs(dy)
        ) {

            if (dx < 0) {

                currentMonth =
                    new Date(
                        currentMonth.getFullYear(),
                        currentMonth.getMonth()
                        + 1,
                        1
                    );

            } else {

                currentMonth =
                    new Date(
                        currentMonth.getFullYear(),
                        currentMonth.getMonth()
                        - 1,
                        1
                    );
            }


            renderCalendar();
        }
    },
    {
        passive: true
    }
);
