<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>カレンダー</title>

<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: #f5f6fa;

    color: #333;

    overscroll-behavior: none;
}

button,
input,
select {
    font: inherit;
}


/* =====================================================
   アプリ全体

   100dvhを使用して、
   Chrome / SafariのブラウザUIによる
   高さのズレを防止
===================================================== */

.app {

    width: 100%;

    height: 100vh;
    height: 100dvh;

    min-height: 0;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* =====================================================
   ヘッダー
===================================================== */

.header {

    height: 58px;

    min-height: 58px;

    flex-shrink: 0;

    background: #405de6;

    color: white;

    display: flex;

    align-items: center;

    padding-top: env(safe-area-inset-top);
}


/* =====================================================
   月ボタン
===================================================== */

.month-button {

    flex: 1;

    height: 58px;

    border: none;

    background: transparent;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   月変更ボタン
===================================================== */

.month-arrow {

    width: 55px;

    min-width: 55px;

    height: 58px;

    border: none;

    background: transparent;

    color: white;

    font-size: 32px;

    line-height: 1;

    cursor: pointer;

    padding: 0;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   曜日
===================================================== */

.week-header {

    height: 36px;

    min-height: 36px;

    flex-shrink: 0;

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    background: white;

    border-bottom: 1px solid #ddd;
}

.week-header div {

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: bold;

    font-size: 14px;

    min-width: 0;
}

.sunday {
    color: #f44336;
}

.saturday {
    color: #1976d2;
}


/* =====================================================
   カレンダー

   残りの高さをすべて使用
===================================================== */

.calendar {

    flex: 1;

    min-height: 0;

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    grid-template-rows:
        repeat(6, minmax(0, 1fr));

    gap: 1px;

    background: #ccc;

    padding: 1px;

    overflow: hidden;

    touch-action: pan-y;

    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   日付マス
===================================================== */

.day-cell {

    min-width: 0;

    min-height: 0;

    background: white;

    padding: 3px;

    overflow: hidden;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   今日
===================================================== */

.day-cell.today {

    background: #ebf0ff;
}


/* =====================================================
   日付
===================================================== */

.day-number {

    height: 20px;

    min-height: 20px;

    flex-shrink: 0;

    font-size: 14px;

    font-weight: bold;

    line-height: 20px;

    overflow: hidden;
}


/* =====================================================
   前月・翌月の日付

   日曜日・土曜日でも灰色
===================================================== */

.other-month .day-number {

    color: #bbb !important;
}


/* =====================================================
   祝日
===================================================== */

.holiday {

    color: #f44336;
}


/* =====================================================
   予定
===================================================== */

.schedule-preview {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 10px;

    line-height: 15px;

    height: 15px;

    min-height: 15px;

    color: #405de6;
}


/* =====================================================
   Todo
===================================================== */

.todo-preview {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 10px;

    line-height: 15px;

    height: 15px;

    min-height: 15px;

    color: #444;
}


/* =====================================================
   完了Todo
===================================================== */

.completed {

    text-decoration: line-through;

    color: #999;
}


/* =====================================================
   他○件
===================================================== */

.more {

    color: #777;

    font-size: 9px;

    line-height: 15px;

    height: 15px;

    min-height: 15px;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   モーダル背景
===================================================== */

.modal-background {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    display: none;

    justify-content: center;

    align-items: flex-end;

    z-index: 1000;
}

.modal-background.show {

    display: flex;
}


/* =====================================================
   日付詳細
===================================================== */

.bottom-sheet {

    width: 100%;

    max-height: 82dvh;

    background: #f5f6fa;

    border-radius:
        20px 20px 0 0;

    padding:
        10px
        15px
        calc(20px + env(safe-area-inset-bottom));

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    animation:
        slideUp .2s ease;
}


/* =====================================================
   アニメーション
===================================================== */

@keyframes slideUp {

    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}


/* =====================================================
   モーダルの取っ手
===================================================== */

.handle {

    width: 45px;

    height: 5px;

    background: #ccc;

    border-radius: 10px;

    margin:
        0 auto 10px;
}


/* =====================================================
   日付タイトル
===================================================== */

.sheet-title {

    font-size: 22px;

    font-weight: bold;

    padding:
        8px 3px 15px;
}


/* =====================================================
   セクション
===================================================== */

.section-title {

    font-size: 19px;

    font-weight: bold;

    margin: 8px 0;
}

.schedule-title {

    color: #405de6;
}


/* =====================================================
   項目
===================================================== */

.item-row {

    background: white;

    border-radius: 8px;

    min-height: 55px;

    margin: 6px 0;

    padding:
        8px 10px;

    display: flex;

    align-items: center;

    gap: 8px;
}


.item-title {

    flex: 1;

    min-width: 0;

    font-size: 17px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =====================================================
   編集
===================================================== */

.edit-button {

    border: none;

    background: transparent;

    color: #405de6;

    cursor: pointer;

    padding: 5px;
}


/* =====================================================
   削除
===================================================== */

.delete-button {

    border: none;

    background: transparent;

    color: #f44336;

    cursor: pointer;

    padding: 5px;
}


/* =====================================================
   空
===================================================== */

.empty {

    color: #888;

    padding: 8px;
}


/* =====================================================
   Todoチェック
===================================================== */

.todo-check {

    width: 20px;

    height: 20px;

    flex-shrink: 0;
}


.todo-completed {

    text-decoration: line-through;

    color: #999;
}


/* =====================================================
   追加画面
===================================================== */

.add-screen {

    position: fixed;

    inset: 0;

    background: #f5f6fa;

    z-index: 2000;

    display: none;

    flex-direction: column;

    height: 100vh;

    height: 100dvh;
}


.add-screen.show {

    display: flex;
}


/* =====================================================
   追加画面ヘッダー
===================================================== */

.add-header {

    height: 58px;

    min-height: 58px;

    background: #405de6;

    color: white;

    display: flex;

    align-items: center;
}


/* =====================================================
   戻る
===================================================== */

.back-button {

    width: 55px;

    min-width: 55px;

    height: 58px;

    border: none;

    background: transparent;

    color: white;

    font-size: 32px;

    padding: 0;
}


/* =====================================================
   追加画面の日付
===================================================== */

.add-date {

    flex: 1;

    text-align: center;

    font-size: 19px;

    font-weight: bold;
}


/* =====================================================
   追加画面
===================================================== */

.add-content {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding:
        16px
        16px
        calc(16px + env(safe-area-inset-bottom));
}


/* =====================================================
   入力タイトル
===================================================== */

.form-title {

    font-size: 20px;

    font-weight: bold;

    margin:
        5px 0 12px;
}

.blue {

    color: #405de6;
}


/* =====================================================
   入力グループ
===================================================== */

.form-group {

    margin-bottom: 25px;
}


/* =====================================================
   入力
===================================================== */

input[type="text"],
select {

    width: 100%;

    height: 50px;

    border:
        1px solid #ddd;

    border-radius: 6px;

    background: white;

    padding: 10px;

    font-size: 16px;

    outline: none;
}


/* =====================================================
   ボタン
===================================================== */

.form-button {

    width: 100%;

    height: 52px;

    border: none;

    border-radius: 6px;

    background: #405de6;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   チェックボックス
===================================================== */

.checkbox-row {

    margin: 10px 0;
}


.checkbox-row label {

    display: flex;

    align-items: center;

    gap: 8px;
}


/* =====================================================
   年月選択
===================================================== */

.year-month-modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.45);

    display: none;

    align-items: flex-end;

    z-index: 1500;
}


.year-month-modal.show {

    display: flex;
}


.year-month-box {

    width: 100%;

    background: white;

    border-radius:
        20px 20px 0 0;

    padding:
        20px
        20px
        calc(20px + env(safe-area-inset-bottom));
}


.year-title {

    text-align: center;

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 10px;
}


.year-control {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;
}


.year-control button {

    width: 50px;

    height: 45px;

    border: none;

    background: #eee;

    font-size: 25px;
}


.year-control span {

    font-size: 20px;

    font-weight: bold;
}


/* =====================================================
   月選択
===================================================== */

.month-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 15px;
}


.month-grid button {

    height: 50px;

    border: none;

    border-radius: 6px;

    background: #f0f1f5;

    font-weight: bold;
}


.month-grid button.selected {

    background: #405de6;

    color: white;
}


/* =====================================================
   スマートフォン
===================================================== */

@media (max-width: 600px) {

    .header {

        height: 56px;

        min-height: 56px;
    }

    .month-button {

        height: 56px;

        font-size: 20px;
    }

    .month-arrow {

        height: 56px;

        width: 50px;

        min-width: 50px;

        font-size: 30px;
    }

    .week-header {

        height: 36px;

        min-height: 36px;
    }

    .day-cell {

        padding: 2px;
    }

    .day-number {

        height: 18px;

        min-height: 18px;

        line-height: 18px;

        font-size: 12px;
    }

    .schedule-preview,
    .todo-preview {

        font-size: 9px;

        line-height: 14px;

        height: 14px;

        min-height: 14px;
    }

    .more {

        font-size: 8px;

        line-height: 14px;

        height: 14px;

        min-height: 14px;
    }
}


/* =====================================================
   非常に小さい画面
===================================================== */

@media (max-height: 650px) {

    .header {

        height: 50px;

        min-height: 50px;
    }

    .month-button {

        height: 50px;

        font-size: 18px;
    }

    .month-arrow {

        height: 50px;

        width: 48px;

        min-width: 48px;

        font-size: 28px;
    }

    .week-header {

        height: 32px;

        min-height: 32px;
    }

    .day-number {

        height: 16px;

        min-height: 16px;

        line-height: 16px;

        font-size: 11px;
    }

    .schedule-preview,
    .todo-preview {

        font-size: 8px;

        line-height: 12px;

        height: 12px;

        min-height: 12px;
    }

    .more {

        font-size: 7px;

        line-height: 12px;

        height: 12px;

        min-height: 12px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     アプリ
===================================================== -->

<div class="app">


    <!-- =================================================
         カレンダーヘッダー
    ================================================== -->

    <div class="header">

        <button
            class="month-arrow"
            id="previousMonth">
            ‹
        </button>


        <button
            class="month-button"
            id="monthButton">
        </button>


        <button
            class="month-arrow"
            id="nextMonth">
            ›
        </button>

    </div>


    <!-- =================================================
         曜日
    ================================================== -->

    <div class="week-header">

        <div class="sunday">
            日
        </div>

        <div>
            月
        </div>

        <div>
            火
        </div>

        <div>
            水
        </div>

        <div>
            木
        </div>

        <div>
            金
        </div>

        <div class="saturday">
            土
        </div>

    </div>


    <!-- =================================================
         カレンダー
    ================================================== -->

    <div
        class="calendar"
        id="calendar">
    </div>


</div>


<!-- =====================================================
     日付詳細
===================================================== -->

<div
    class="modal-background"
    id="dateModal">


    <div class="bottom-sheet">


        <div class="handle"></div>


        <div
            class="sheet-title"
            id="dateTitle">
        </div>


        <!-- 予定 -->

        <div
            class="section-title schedule-title">

            📅 予定

        </div>


        <div
            id="scheduleList">
        </div>


        <!-- Todo -->

        <div
            class="section-title">

            ☑ Todo

        </div>


        <div
            id="todoList">
        </div>


        <button
            class="form-button"
            id="modalAddButton"
            style="margin-top:15px;">

            ＋ この日に追加

        </button>


    </div>

</div>


<!-- =====================================================
     追加画面
===================================================== -->

<div
    class="add-screen"
    id="addScreen">


    <!-- ヘッダー -->

    <div class="add-header">


        <button
            class="back-button"
            id="backButton">

            ‹

        </button>


        <div
            class="add-date"
            id="addDate">
        </div>


        <div
            style="width:55px;">
        </div>


    </div>


    <!-- 入力 -->

    <div class="add-content">


        <!-- =================================================
             予定
        ================================================== -->

        <div class="form-group">


            <div class="form-title blue">

                📅 予定を追加

            </div>


            <input
                type="text"
                id="scheduleInput"
                placeholder="予定のタイトル">


            <div
                style="margin-top:10px;">

                繰り返し

            </div>


            <select
                id="scheduleRepeat">

                <option value="NONE">
                    なし
                </option>

                <option value="DAILY">
                    毎日
                </option>

                <option value="WEEKLY">
                    毎週
                </option>

                <option value="MONTHLY">
                    毎月
                </option>

            </select>


            <button
                class="form-button"
                id="addSchedule"
                style="margin-top:10px;">

                予定を追加

            </button>


        </div>


        <!-- =================================================
             Todo
        ================================================== -->

        <div class="form-group">


            <div class="form-title">

                ☑ Todoを追加

            </div>


            <input
                type="text"
                id="todoInput"
                placeholder="Todoを入力">


            <div
                style="margin-top:10px;">

                繰り返し

            </div>


            <select
                id="todoRepeat">

                <option value="NONE">
                    なし
                </option>

                <option value="DAILY">
                    毎日
                </option>

                <option value="WEEKLY">
                    毎週
                </option>

                <option value="MONTHLY">
                    毎月
                </option>

            </select>


            <div class="checkbox-row">


                <label>


                    <input
                        type="checkbox"
                        id="carryOver">


                    未完了なら明日に持ち越す


                </label>


            </div>


            <button
                class="form-button"
                id="addTodo">

                Todoを追加

            </button>


        </div>


    </div>

</div>


<!-- =====================================================
     年月選択
===================================================== -->

<div
    class="year-month-modal"
    id="yearMonthModal">


    <div class="year-month-box">


        <div class="year-title">

            年月を選択

        </div>


        <div class="year-control">


            <button
                id="previousYear">

                ‹

            </button>


            <span
                id="yearText">
            </span>


            <button
                id="nextYear">

                ›

            </button>


        </div>


        <div
            class="month-grid"
            id="monthGrid">
        </div>


    </div>

</div>


<script>

/* =====================================================
   データ
===================================================== */

let schedules =
    JSON.parse(
        localStorage.getItem("schedules")
        || "[]"
    );


let todos =
    JSON.parse(
        localStorage.getItem("todos")
        || "[]"
    );


/* =====================================================
   現在の月
===================================================== */

let currentMonth =
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    );


/* =====================================================
   選択日
===================================================== */

let selectedDate =
    new Date();


/* =====================================================
   保存
===================================================== */

function saveData() {

    localStorage.setItem(
        "schedules",
        JSON.stringify(schedules)
    );

    localStorage.setItem(
        "todos",
        JSON.stringify(todos)
    );
}


/* =====================================================
   ID
===================================================== */

function createId() {

    return Date.now()
        + Math.floor(
            Math.random() * 100000
        );
}


/* =====================================================
   日付キー
===================================================== */

function dateKey(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


/* =====================================================
   日付判定
===================================================== */

function isDate(item, date) {

    const start =
        new Date(
            item.year,
            item.month - 1,
            item.day
        );


    if (date < start) {

        return false;
    }


    switch (item.repeat) {


        case "DAILY":

            return true;


        case "WEEKLY":

            return (
                date.getDay()
                === start.getDay()
            );


        case "MONTHLY":

            return (
                date.getDate()
                === start.getDate()
            );


        default:

            return (
                dateKey(date)
                === dateKey(start)
            );
    }
}


/* =====================================================
   日本の祝日
===================================================== */

function getJapaneseHolidays(year) {

    const holidays = {};


    function add(
        month,
        day,
        name
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );


        holidays[
            dateKey(date)
        ] = name;
    }


    function nthMonday(
        month,
        nth
    ) {

        const first =
            new Date(
                year,
                month - 1,
                1
            );


        const firstDay =
            first.getDay();


        const day =
            1
            + ((8 - firstDay) % 7)
            + (nth - 1) * 7;


        return new Date(
            year,
            month - 1,
            day
        );
    }


    /* =================================================
       固定祝日
    ================================================== */

    add(
        1,
        1,
        "元日"
    );


    const comingOfAge =
        nthMonday(
            1,
            2
        );


    holidays[
        dateKey(comingOfAge)
    ] =
        "成人の日";


    add(
        2,
        11,
        "建国記念の日"
    );


    add(
        2,
        23,
        "天皇誕生日"
    );


    /* =================================================
       春分の日
    ================================================== */

    const springDay =
        Math.floor(
            20.8431
            + 0.242194
                * (year - 1980)
            - Math.floor(
                (year - 1980) / 4
            )
        );


    add(
        3,
        springDay,
        "春分の日"
    );


    add(
        4,
        29,
        "昭和の日"
    );


    add(
        5,
        3,
        "憲法記念日"
    );


    add(
        5,
        4,
        "みどりの日"
    );


    add(
        5,
        5,
        "こどもの日"
    );


    /* =================================================
       海の日
    ================================================== */

    const marine =
        nthMonday(
            7,
            3
        );


    holidays[
        dateKey(marine)
    ] =
        "海の日";


    /* =================================================
       山の日
    ================================================== */

    add(
        8,
        11,
        "山の日"
    );


    /* =================================================
       敬老の日
    ================================================== */

    const respect =
        nthMonday(
            9,
            3
        );


    holidays[
        dateKey(respect)
    ] =
        "敬老の日";


    /* =================================================
       秋分の日
    ================================================== */

    const autumnDay =
        Math.floor(
            23.2488
            + 0.242194
                * (year - 1980)
            - Math.floor(
                (year - 1980) / 4
            )
        );


    add(
        9,
        autumnDay,
        "秋分の日"
    );


    /* =================================================
       スポーツの日
    ================================================== */

    const sports =
        nthMonday(
            10,
            2
        );


    holidays[
        dateKey(sports)
    ] =
        "スポーツの日";


    add(
        11,
        3,
        "文化の日"
    );


    add(
        11,
        23,
        "勤労感謝の日"
    );


    /* =================================================
       振替休日
    ================================================== */

    const original =
        Object.keys(holidays)
            .map(
                key => ({
                    key,
                    name:
                        holidays[key]
                })
            );


    for (
        const holiday
        of original
    ) {


        const parts =
            holiday.key.split("-");


        const date =
            new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2])
            );


        if (
            date.getDay() === 0
        ) {


            let substitute =
                new Date(date);


            substitute.setDate(
                substitute.getDate()
                + 1
            );


            while (
                holidays[
                    dateKey(
                        substitute
                    )
                ]
            ) {

                substitute.setDate(
                    substitute.getDate()
                    + 1
                );
            }


            holidays[
                dateKey(substitute)
            ] =
                "振替休日";
        }
    }


    return holidays;
}


/* =====================================================
   カレンダー表示
===================================================== */

function renderCalendar() {


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    document.getElementById(
        "monthButton"
    ).textContent =
        `${year}年${month + 1}月`;


    const first =
        new Date(
            year,
            month,
            1
        );


    const startDay =
        first.getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const holidays =
        getJapaneseHolidays(
            year
        );


    /* =================================================
       42マス
    ================================================== */

    for (
        let i = 0;
        i < 42;
        i++
    ) {


        const dayNumber =
            i - startDay + 1;


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const thisMonth =
            date.getMonth()
                === month;


        /* =================================================
           マス
        ================================================== */

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day-cell";


        if (!thisMonth) {

            cell.classList.add(
                "other-month"
            );
        }


        /* =================================================
           今日
        ================================================== */

        if (
            dateKey(date)
            === dateKey(
                new Date()
            )
        ) {

            cell.classList.add(
                "today"
            );
        }


        /* =================================================
           日付
        ================================================== */

        const dayText =
            document.createElement(
                "div"
            );


        dayText.className =
            "day-number";


        dayText.textContent =
            date.getDate();


        /*
           重要：

           当月のみ
           日曜日＝赤
           土曜日＝青

           前月・翌月は
           全曜日を灰色
        */

        if (thisMonth) {


            if (
                date.getDay() === 0
                || holidays[
                    dateKey(date)
                ]
            ) {

                dayText.classList.add(
                    "holiday"
                );

            } else if (
                date.getDay() === 6
            ) {

                dayText.style.color =
                    "#1976d2";
            }
        }


        cell.appendChild(
            dayText
        );


        /* =================================================
           祝日名
        ================================================== */

        if (
            thisMonth
            && holidays[
                dateKey(date)
            ]
        ) {


            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "schedule-preview holiday";


            holiday.textContent =
                holidays[
                    dateKey(date)
                ];


            cell.appendChild(
                holiday
            );
        }


        /* =================================================
           予定＋Todo
        ================================================== */

        const items = [];


        for (
            const schedule
            of schedules
        ) {


            if (
                isDate(
                    schedule,
                    date
                )
            ) {


                items.push({

                    type:
                        "schedule",

                    item:
                        schedule

                });
            }
        }


        for (
            const todo
            of todos
        ) {


            if (
                isDate(
                    todo,
                    date
                )
            ) {


                items.push({

                    type:
                        "todo",

                    item:
                        todo

                });
            }
        }


        /* =================================================
           表示数

           1～4件 → 最大4件

           5件以上
           → 3件＋他○件
        ================================================== */

        const displayCount =
            items.length >= 5
                ? 3
                : Math.min(
                    items.length,
                    4
                );


        for (
            let j = 0;
            j < displayCount;
            j++
        ) {


            const data =
                items[j];


            const text =
                document.createElement(
                    "div"
                );


            if (
                data.type
                === "schedule"
            ) {


                text.className =
                    "schedule-preview";


                /*
                   予定の左に○は付けない
                */

                text.textContent =
                    data.item.title;


            } else {


                text.className =
                    "todo-preview";


                const completed =
                    isTodoCompleted(
                        data.item,
                        date
                    );


                text.textContent =
                    (
                        completed
                            ? "✓ "
                            : "□ "
                    )
                    + data.item.title;


                if (completed) {

                    text.classList.add(
                        "completed"
                    );
                }
            }


            cell.appendChild(
                text
            );
        }


        /* =================================================
           他○件
        ================================================== */

        if (
            items.length >= 5
        ) {


            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =
                `…他${items.length - 3}件`;


            cell.appendChild(
                more
            );
        }


        /* =================================================
           日付クリック
        ================================================== */

        cell.addEventListener(
            "click",
            () => {


                selectedDate =
                    new Date(date);


                showDateModal();
            }
        );


        calendar.appendChild(
            cell
        );
    }
}


/* =====================================================
   Todo完了判定
===================================================== */

function isTodoCompleted(
    todo,
    date
) {


    if (
        todo.repeat === "NONE"
    ) {

        return !!todo.completed;
    }


    return (
        todo.completedDates
        || []
    ).includes(
        dateKey(date)
    );
}


/* =====================================================
   Todo完了変更
===================================================== */

function setTodoCompleted(
    todo,
    date,
    completed
) {


    if (
        todo.repeat === "NONE"
    ) {


        todo.completed =
            completed;


        return;
    }


    if (
        !todo.completedDates
    ) {

        todo.completedDates =
            [];
    }


    const key =
        dateKey(date);


    const index =
        todo.completedDates
            .indexOf(key);


    if (
        completed
        && index === -1
    ) {


        todo.completedDates.push(
            key
        );


    } else if (
        !completed
        && index !== -1
    ) {


        todo.completedDates.splice(
            index,
            1
        );
    }
}

    ================================================== */

    schedules.forEach(
        (schedule, index) => {


            if (
                !isDate(
                    schedule,
                    selectedDate

            ) {

                return;
            }


            scheduleCount++;

                document.createElement(
                    "div"
                );


            row.className =

                    "div"
                );

            const edit =

                );


            edit.className =
                "edit-button";


            edit.textContent =
                "編集";


            edit.onclick =
                () =>
                    editSchedule(
                        index
                    );


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "delete-button";


            del.textContent =
                "削除";


            del.onclick =
                () =>
                    deleteSchedule(
                        index
                    );


            row.appendChild(
                title
            );


            row.appendChild(
                edit
            );


            row.appendChild(
                del
            );


            scheduleList.appendChild(
                row
            );
        }
    );


    if (
        scheduleCount === 0
    ) {

        scheduleList.innerHTML =
            `<div class="empty">
                予定はありません
            </div>`;
    }


    /* =================================================
       Todo
    ================================================== */

    let todoCount =
        0;


    todos.forEach(
        (todo, index) => {


            if (
                !isDate(
                    todo,
                    selectedDate
                )
            ) {

                return;
            }


            todoCount++;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "item-row";


            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.className =
                "todo-check";


            check.checked =
                isTodoCompleted(
                    todo,
                    selectedDate
                );


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "item-title";


            title.textContent =
                todo.title;


            if (
                check.checked
            ) {

                title.classList.add(
                    "todo-completed"
                );
            }


            check.onchange =
                () => {


                    setTodoCompleted(
                        todo,
                        selectedDate,
                        check.checked
                    );


                    saveData();


                    showDateModal();


                    renderCalendar();
                };


            const edit =
                document.createElement(
                    "button"
                );


            edit.className =
                "edit-button";


            edit.textContent =
                "編集";


            edit.onclick =
                () =>
                    editTodo(
                        index
                    );


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "delete-button";


            del.textContent =
                "削除";


            del.onclick =
                () =>
                    deleteTodo(
                        index
                    );


            row.appendChild(
                check
            );


            row.appendChild(
                title
            );


            row.appendChild(
                edit
            );


            row.appendChild(
                del
            );


            todoList.appendChild(
                row
            );
        }
    );


    if (
        todoCount === 0
    ) {

        todoList.innerHTML =
            `<div class="empty">
                Todoはありません
            </div>`;
    }


    modal.classList.add(
        "show"
    );
}

/* =====================================================
   予定編集
===================================================== */

function editSchedule(
    index
) {


    const schedule =
        schedules[index];


    const title =
        prompt(
            "予定を編集",
            schedule.title
        );


    if (
        title === null
    ) {

        return;
    }


    const newTitle =
        title.trim();


    if (
        newTitle === ""
    ) {

        return;
    }


    schedule.title =
        newTitle;


    const repeat =
        prompt(
            "繰り返しを入力してください\n"
            + "NONE / DAILY / WEEKLY / MONTHLY",
            schedule.repeat
        );


    if (
        repeat
        && [
            "NONE",
            "DAILY",
            "WEEKLY",
            "MONTHLY"
        ].includes(
            repeat.toUpperCase()
        )
    ) {


        schedule.repeat =
            repeat.toUpperCase();
    }


    saveData();


    showDateModal();


    renderCalendar();
}

/* =====================================================
   左右スワイプ
===================================================== */

let touchStartX = 0;

let touchStartY = 0;

let touchStartTime = 0;


const calendar =
    document.getElementById(
        "calendar"
    );


calendar.addEventListener(
    "touchstart",
    event => {


        if (
            !event.changedTouches.length
        ) {

            return;
        }


        touchStartX =
            event.changedTouches[0]
                .screenX;


        touchStartY =
            event.changedTouches[0]
                .screenY;


        touchStartTime =
            Date.now();

    },
    {
        passive: true
    }
);


calendar.addEventListener(
    "touchend",
    event => {


        if (
            !event.changedTouches.length
        ) {

            return;
        }


        const endX =
            event.changedTouches[0]
                .screenX;


        const endY =
            event.changedTouches[0]
                .screenY;


        const dx =
            endX - touchStartX;


        const dy =
            endY - touchStartY;


        const elapsed =
            Date.now()
            - touchStartTime;


        /*
           横方向のスワイプだけ
        */

        if (
            Math.abs(dx) >= 60
            && Math.abs(dx)
                > Math.abs(dy)
            && elapsed < 700
        ) {


            if (
                dx < 0
            ) {


                currentMonth =
                    new Date(
                        currentMonth
                            .getFullYear(),

                        currentMonth
                            .getMonth()
                            + 1,

                        1
                    );


            } else {


                currentMonth =
                    new Date(
                        currentMonth
                            .getFullYear(),

                        currentMonth
                            .getMonth()
                            - 1,

                        1
                    );
            }


            renderCalendar();
        }

    },
    {
        passive: true
    }
);
