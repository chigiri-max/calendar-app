<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#405de6">

<title>カレンダー</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: #f5f6fa;
    color: #333;
}

button,
input,
select {
    font: inherit;
}

button {
    touch-action: manipulation;
}


/* =====================================================
   アプリ全体
===================================================== */

.app {
    width: 100%;
    height: 100dvh;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    background: #fff;
}


/* =====================================================
   ヘッダー
===================================================== */

.header {
    height: 58px;
    min-height: 58px;

    background: #405de6;
    color: #fff;

    display: flex;
    align-items: center;
}

.month-button {
    flex: 1;
    height: 100%;

    border: 0;
    background: transparent;

    color: #fff;

    font-size: 20px;
    font-weight: 700;

    cursor: pointer;
}

.month-arrow {
    width: 55px;
    min-width: 55px;
    height: 100%;

    border: 0;
    background: transparent;

    color: #fff;

    font-size: 32px;

    cursor: pointer;
}


/* =====================================================
   曜日
===================================================== */

.week-header {
    height: 36px;
    min-height: 36px;

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    background: #fff;

    border-bottom: 1px solid #ddd;
}

.week-header div {
    display: flex;

    justify-content: center;
    align-items: center;

    font-weight: 700;
    font-size: 14px;
}

.sunday {
    color: #f44336;
}

.saturday {
    color: #1976d2;
}


/* =====================================================
   カレンダー
===================================================== */

.calendar {
    flex: 1;
    min-height: 0;

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    grid-template-rows:
        repeat(6, minmax(0, 1fr));

    gap: 1px;

    background: #ccc;

    padding: 1px;

    touch-action: pan-y;

    user-select: none;
}

.day-cell {
    min-width: 0;
    min-height: 0;

    background: #fff;

    padding: 3px;

    overflow: hidden;

    cursor: pointer;

    display: flex;
    flex-direction: column;
}

.day-cell.today {
    background: #ebf0ff;
}

.day-number {
    height: 20px;

    flex-shrink: 0;

    font-size: 14px;
    font-weight: 700;
}

.other-month .day-number {
    color: #bbb;
}

.holiday {
    color: #f44336;
}


/* =====================================================
   予定・Todo表示
===================================================== */

.schedule-preview,
.todo-preview {
    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 10px;

    line-height: 15px;

    height: 15px;

    flex-shrink: 0;
}

.schedule-preview {
    color: #405de6;
}

.todo-preview {
    color: #444;
}

.completed {
    text-decoration: line-through;
    color: #999;
}

.more {
    color: #777;

    font-size: 9px;

    line-height: 15px;

    height: 15px;

    flex-shrink: 0;
}


/* =====================================================
   ＋ボタン
===================================================== */

.bottom {
    height: 70px;
    min-height: 70px;

    background: #fff;

    display: flex;

    justify-content: flex-end;
    align-items: center;

    padding-right: 12px;

    flex-shrink: 0;

    box-shadow:
        0 -2px 8px rgba(0,0,0,.08);
}

.add-button {
    width: 60px;
    height: 60px;

    border-radius: 50%;
    border: 0;

    background: #405de6;

    color: #fff;

    font-size: 30px;

    cursor: pointer;
}


/* =====================================================
   日付詳細モーダル
===================================================== */

.modal-background {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    display: none;

    justify-content: center;
    align-items: flex-end;

    z-index: 1000;
}

.modal-background.show {
    display: flex;
}

.bottom-sheet {
    width: min(100%, 700px);

    max-height: 82dvh;

    background: #f5f6fa;

    border-radius:
        20px 20px 0 0;

    padding:
        10px 15px 20px;

    overflow-y: auto;

    animation:
        slideUp .2s ease;
}

@keyframes slideUp {

    from {
        transform:
            translateY(100%);
    }

    to {
        transform:
            translateY(0);
    }
}

.handle {
    width: 45px;
    height: 5px;

    background: #ccc;

    border-radius: 10px;

    margin:
        0 auto 10px;
}

.sheet-title {
    font-size: 22px;

    font-weight: 700;

    padding:
        8px 3px 15px;
}

.section-title {
    font-size: 19px;

    font-weight: 700;

    margin:
        8px 0;
}

.schedule-title {
    color: #405de6;
}


/* =====================================================
   予定・Todo一覧
===================================================== */

.item-row {
    background: #fff;

    border-radius: 8px;

    min-height: 55px;

    margin: 6px 0;

    padding:
        8px 10px;

    display: flex;

    align-items: center;

    gap: 8px;
}

.item-title {
    flex: 1;

    min-width: 0;

    font-size: 17px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.edit-button,
.delete-button {
    border: 0;

    background: transparent;

    cursor: pointer;

    padding:
        8px 4px;
}

.edit-button {
    color: #405de6;
}

.delete-button {
    color: #f44336;
}

.empty {
    color: #888;

    padding: 8px;
}


/* =====================================================
   Todoチェック
===================================================== */

.todo-check {
    width: 20px;
    height: 20px;

    flex:
        0 0 20px;
}

.todo-completed {
    text-decoration: line-through;

    color: #999;
}


/* =====================================================
   追加画面
===================================================== */

.add-screen {
    position: fixed;

    inset: 0;

    background: #f5f6fa;

    z-index: 2000;

    display: none;

    flex-direction: column;
}

.add-screen.show {
    display: flex;
}

.add-header {
    height: 58px;
    min-height: 58px;

    background: #405de6;

    color: #fff;

    display: flex;

    align-items: center;
}

.back-button {
    width: 55px;
    min-width: 55px;

    height: 100%;

    border: 0;

    background: transparent;

    color: #fff;

    font-size: 32px;
}

.add-date {
    flex: 1;

    text-align: center;

    font-size: 19px;

    font-weight: 700;
}

.add-content {
    flex: 1;

    overflow-y: auto;

    padding: 16px;

    padding-bottom:
        max(
            16px,
            env(safe-area-inset-bottom)
        );
}

.form-title {
    font-size: 20px;

    font-weight: 700;

    margin:
        5px 0 12px;
}

.blue {
    color: #405de6;
}

.form-group {
    margin-bottom: 25px;
}

input[type="text"],
select {
    width: 100%;

    height: 50px;

    border:
        1px solid #ddd;

    border-radius: 6px;

    background: #fff;

    padding: 10px;

    font-size: 16px;
}

.form-button {
    width: 100%;

    height: 52px;

    border: 0;

    border-radius: 6px;

    background: #405de6;

    color: #fff;

    font-weight: 700;

    cursor: pointer;
}

.checkbox-row {
    margin:
        10px 0;
}

.checkbox-row label {
    display: flex;

    align-items: center;

    gap: 8px;
}


/* =====================================================
   年月選択
===================================================== */

.year-month-modal {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.45);

    display: none;

    align-items: flex-end;

    z-index: 1500;
}

.year-month-modal.show {
    display: flex;
}

.year-month-box {
    width: min(100%, 700px);

    margin: 0 auto;

    background: #fff;

    border-radius:
        20px 20px 0 0;

    padding: 20px;
}

.year-title {
    text-align: center;

    font-size: 21px;

    font-weight: 700;

    margin-bottom: 10px;
}

.year-control {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;
}

.year-control button {
    width: 50px;
    height: 45px;

    border: 0;

    background: #eee;

    font-size: 25px;
}

.year-control span {
    font-size: 20px;

    font-weight: 700;
}

.month-grid {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    margin-top: 15px;
}

.month-grid button {
    height: 50px;

    border: 0;

    border-radius: 6px;

    background: #f0f1f5;

    font-weight: 700;
}

.month-grid button.selected {
    background: #405de6;

    color: #fff;
}


/* =====================================================
   PC
===================================================== */

@media (min-width: 700px) {

    .app {
        max-width: 1100px;

        margin: 0 auto;

        box-shadow:
            0 0 18px rgba(0,0,0,.08);
    }

    .day-number {
        font-size: 15px;
    }

    .schedule-preview,
    .todo-preview {
        font-size: 11px;
    }
}


/* =====================================================
   スマホ
===================================================== */

@media (max-width: 600px) {

    .header {
        height: 54px;
        min-height: 54px;
    }

    .month-arrow {
        width: 48px;
        min-width: 48px;
    }

    .month-button {
        font-size: 18px;
    }

    .week-header {
        height: 32px;
        min-height: 32px;
    }

    .week-header div {
        font-size: 13px;
    }

    .day-cell {
        padding: 2px;
    }

    .day-number {
        font-size: 12px;

        height: 18px;
    }

    .schedule-preview,
    .todo-preview {
        font-size: 9px;

        line-height: 14px;

        height: 14px;
    }

    .more {
        font-size: 8px;

        line-height: 14px;

        height: 14px;
    }

    .bottom {
        height: 68px;

        min-height: 68px;
    }

    .add-button {
        width: 56px;
        height: 56px;
    }
}


/* =====================================================
   画面が縦に小さい場合
===================================================== */

@media (max-height: 650px) {

    .header {
        height: 50px;
        min-height: 50px;
    }

    .week-header {
        height: 30px;
        min-height: 30px;
    }

    .bottom {
        height: 60px;
        min-height: 60px;
    }

    .add-button {
        width: 52px;
        height: 52px;
    }

    .day-number {
        height: 17px;
    }

    .schedule-preview,
    .todo-preview,
    .more {
        line-height: 13px;

        height: 13px;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- =================================================
         ヘッダー
    ================================================== -->

    <div class="header">

        <button
            class="month-arrow"
            id="previousMonth"
            aria-label="前の月">
            ‹
        </button>

        <button
            class="month-button"
            id="monthButton"
            aria-label="年月を選択">
        </button>

        <button
            class="month-arrow"
            id="nextMonth"
            aria-label="次の月">
            ›
        </button>

    </div>


    <!-- =================================================
         曜日
    ================================================== -->

    <div class="week-header">

        <div class="sunday">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div class="saturday">土</div>

    </div>


    <!-- =================================================
         カレンダー
    ================================================== -->

    <div
        class="calendar"
        id="calendar">
    </div>


    <!-- =================================================
         ＋ボタン
    ================================================== -->

    <div class="bottom">

        <button
            class="add-button"
            id="homeAddButton"
            aria-label="追加">
            +
        </button>

    </div>

</div>


<!-- =====================================================
     日付詳細
===================================================== -->

<div
    class="modal-background"
    id="dateModal">

    <div class="bottom-sheet">

        <div class="handle"></div>

        <div
            class="sheet-title"
            id="dateTitle">
        </div>


        <div class="section-title schedule-title">
            📅 予定
        </div>

        <div id="scheduleList"></div>


        <div class="section-title">
            ☑ Todo
        </div>

        <div id="todoList"></div>


        <button
            class="form-button"
            id="modalAddButton"
            style="margin-top:15px;">
            ＋ この日に追加
        </button>

    </div>

</div>


<!-- =====================================================
     追加画面
===================================================== -->

<div
    class="add-screen"
    id="addScreen">


    <div class="add-header">

        <button
            class="back-button"
            id="backButton"
            aria-label="戻る">
            ‹
        </button>

        <div
            class="add-date"
            id="addDate">
        </div>

        <div style="width:55px;"></div>

    </div>


    <div class="add-content">


        <!-- 予定 -->

        <div class="form-group">

            <div class="form-title blue">
                📅 予定を追加
            </div>


            <input
                type="text"
                id="scheduleInput"
                placeholder="予定のタイトル">


            <div style="margin-top:10px;">
                繰り返し
            </div>


            <select id="scheduleRepeat">

                <option value="NONE">
                    なし
                </option>

                <option value="DAILY">
                    毎日
                </option>

                <option value="WEEKLY">
                    毎週
                </option>

                <option value="MONTHLY">
                    毎月
                </option>

            </select>


            <button
                class="form-button"
                id="addSchedule"
                style="margin-top:10px;">
                予定を追加
            </button>

        </div>


        <!-- Todo -->

        <div class="form-group">

            <div class="form-title">
                ☑ Todoを追加
            </div>


            <input
                type="text"
                id="todoInput"
                placeholder="Todoを入力">


            <div style="margin-top:10px;">
                繰り返し
            </div>


            <select id="todoRepeat">

                <option value="NONE">
                    なし
                </option>

                <option value="DAILY">
                    毎日
                </option>

                <option value="WEEKLY">
                    毎週
                </option>

                <option value="MONTHLY">
                    毎月
                </option>

            </select>


            <div class="checkbox-row">

                <label>

                    <input
                        type="checkbox"
                        id="carryOver">

                    未完了なら明日に持ち越す

                </label>

            </div>


            <button
                class="form-button"
                id="addTodo">
                Todoを追加
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     年月選択
===================================================== -->

<div
    class="year-month-modal"
    id="yearMonthModal">


    <div class="year-month-box">

        <div class="year-title">
            年月を選択
        </div>


        <div class="year-control">

            <button id="previousYear">
                ‹
            </button>

            <span id="yearText"></span>

            <button id="nextYear">
                ›
            </button>

        </div>


        <div
            class="month-grid"
            id="monthGrid">
        </div>

    </div>

</div>


<script>


/* =====================================================
   データ
===================================================== */

let schedules =
    JSON.parse(
        localStorage.getItem("schedules") || "[]"
    );

let todos =
    JSON.parse(
        localStorage.getItem("todos") || "[]"
    );


let currentMonth =
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    );


let selectedDate =
    new Date();


/* =====================================================
   保存
===================================================== */

function saveData() {

    localStorage.setItem(
        "schedules",
        JSON.stringify(schedules)
    );

    localStorage.setItem(
        "todos",
        JSON.stringify(todos)
    );
}


/* =====================================================
   ID
===================================================== */

function createId() {

    return Date.now()
        + Math.floor(
            Math.random() * 100000
        );
}


/* =====================================================
   日付キー
===================================================== */

function dateKey(date) {

    return (
        `${date.getFullYear()}-`
        + `${String(
            date.getMonth() + 1
        ).padStart(2, "0")}-`
        + `${String(
            date.getDate()
        ).padStart(2, "0")}`
    );
}


/* =====================================================
   ローカル日付
===================================================== */

function localDate(
    year,
    month,
    day
) {

    return new Date(
        year,
        month - 1,
        day
    );
}


/* =====================================================
   予定・Todoの日付判定
===================================================== */

function isDate(
    item,
    date
) {

    const start =
        localDate(
            item.year,
            item.month,
            item.day
        );


    if (date < start) {

        return false;
    }


    switch (item.repeat) {

        case "DAILY":

            return true;


        case "WEEKLY":

            return (
                date.getDay()
                === start.getDay()
            );


        case "MONTHLY":

            return (
                date.getDate()
                === start.getDate()
            );


        default:

            return (
                dateKey(date)
                === dateKey(start)
            );
    }
}


/* =====================================================
   日本の祝日
===================================================== */

function getJapaneseHolidays(year) {

    const holidays = {};


    function add(
        month,
        day,
        name
    ) {

        holidays[
            dateKey(
                new Date(
                    year,
                    month - 1,
                    day
                )
            )
        ] = name;
    }


    function nthMonday(
        month,
        nth
    ) {

        const first =
            new Date(
                year,
                month - 1,
                1
            );


        const day =
            1
            + (
                (8 - first.getDay())
                % 7
            )
            + (
                (nth - 1) * 7
            );


        return new Date(
            year,
            month - 1,
            day
        );
    }


    /* 春分の日 */

    const vernal =
        Math.floor(
            20.8431
            + 0.242194
                * (year - 1980)
            - Math.floor(
                (year - 1980) / 4
            )
        );


    /* 秋分の日 */

    const autumnal =
        Math.floor(
            23.2488
            + 0.242194
                * (year - 1980)
            - Math.floor(
                (year - 1980) / 4
            )
        );


    /* 元日 */

    add(
        1,
        1,
        "元日"
    );


    /* 成人の日 */

    let date =
        nthMonday(
            1,
            2
        );

    holidays[
        dateKey(date)
    ] = "成人の日";


    /* 建国記念の日 */

    add(
        2,
        11,
        "建国記念の日"
    );


    /* 天皇誕生日 */

    if (year >= 2020) {

        add(
            2,
            23,
            "天皇誕生日"
        );

    } else if (
        year >= 1989
        && year <= 2018
    ) {

        add(
            12,
            23,
            "天皇誕生日"
        );
    }


    /* 春分の日 */

    add(
        3,
        vernal,
        "春分の日"
    );


    /* 昭和の日 */

    add(
        4,
        29,
        "昭和の日"
    );


    /* ゴールデンウィーク */

    add(
        5,
        3,
        "憲法記念日"
    );

    add(
        5,
        4,
        "みどりの日"
    );

    add(
        5,
        5,
        "こどもの日"
    );


    /* 海の日 */

    date =
        nthMonday(
            7,
            3
        );

    holidays[
        dateKey(date)
    ] = "海の日";


    /* 山の日 */

    add(
        8,
        11,
        "山の日"
    );


    /* 敬老の日 */

    date =
        nthMonday(
            9,
            3
        );

    holidays[
        dateKey(date)
    ] = "敬老の日";


    /* 秋分の日 */

    add(
        9,
        autumnal,
        "秋分の日"
    );


    /* スポーツの日 */

    date =
        nthMonday(
            10,
            2
        );

    holidays[
        dateKey(date)
    ] = "スポーツの日";


    /* 文化の日 */

    add(
        11,
        3,
        "文化の日"
    );


    /* 勤労感謝の日 */

    add(
        11,
        23,
        "勤労感謝の日"
    );


    /* =================================================
       2020年特例
    ================================================= */

    if (year === 2020) {

        delete holidays[
            dateKey(
                new Date(
                    year,
                    6,
                    20
                )
            )
        ];

        delete holidays[
            dateKey(
                new Date(
                    year,
                    9,
                    12
                )
            )
        ];


        add(
            7,
            23,
            "海の日"
        );

        add(
            7,
            24,
            "スポーツの日"
        );

        add(
            8,
            10,
            "山の日"
        );
    }


    /* =================================================
       2021年特例
    ================================================= */

    if (year === 2021) {

        delete holidays[
            dateKey(
                new Date(
                    year,
                    6,
                    19
                )
            )
        ];

        delete holidays[
            dateKey(
                new Date(
                    year,
                    9,
                    11
                )
            )
        ];


        add(
            7,
            22,
            "海の日"
        );

        add(
            7,
            23,
            "スポーツの日"
        );

        add(
            8,
            8,
            "山の日"
        );
    }


    /* =================================================
       国民の休日
    ================================================= */

    for (
        let day = 1;
        day <= 366;
        day++
    ) {

        const current =
            new Date(
                year,
                0,
                day
            );


        if (
            current.getFullYear()
            !== year
        ) {

            break;
        }


        if (
            current.getDay() === 0
            || current.getDay() === 6
            || holidays[
                dateKey(current)
            ]
        ) {

            continue;
        }


        const previous =
            new Date(current);

        previous.setDate(
            current.getDate() - 1
        );


        const next =
            new Date(current);

        next.setDate(
            current.getDate() + 1
        );


        if (
            holidays[
                dateKey(previous)
            ]
            &&
            holidays[
                dateKey(next)
            ]
        ) {

            holidays[
                dateKey(current)
            ] = "国民の休日";
        }
    }


    /* =================================================
       振替休日
    ================================================= */

    const originals =
        Object.keys(
            holidays
        );


    for (
        const key of originals
    ) {

        const holidayDate =
            new Date(
                key + "T00:00:00"
            );


        if (
            holidayDate.getDay()
            !== 0
        ) {

            continue;
        }


        let substitute =
            new Date(
                holidayDate
            );


        substitute.setDate(
            substitute.getDate() + 1
        );


        while (
            holidays[
                dateKey(substitute)
            ]
            ||
            substitute.getDay() === 0
            ||
            substitute.getDay() === 6
        ) {

            substitute.setDate(
                substitute.getDate() + 1
            );
        }


        holidays[
            dateKey(substitute)
        ] = "振替休日";
    }


    /* =================================================
       2019年特例
    ================================================= */

    if (year === 2019) {

        holidays[
            "2019-04-30"
        ] = "国民の休日";

        holidays[
            "2019-05-01"
        ] = "即位の日";

        holidays[
            "2019-05-02"
        ] = "国民の休日";

        holidays[
            "2019-10-22"
        ] = "即位礼正殿の儀";
    }


    return holidays;
}


/* =====================================================
   指定日の予定・Todo
===================================================== */

function getItemsForDate(
    date
) {

    const items = [];


    for (
        const schedule of schedules
    ) {

        if (
            isDate(
                schedule,
                date
            )
        ) {

            items.push({
                type: "schedule",
                item: schedule
            });
        }
    }


    for (
        const todo of todos
    ) {

        if (
            isDate(
                todo,
                date
            )
        ) {

            items.push({
                type: "todo",
                item: todo
            });
        }
    }


    return items;
}


/* =====================================================
   カレンダー表示
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    document.getElementById(
        "monthButton"
    ).textContent =
        `${year}年${month + 1}月`;


    const first =
        new Date(
            year,
            month,
            1
        );


    const startDay =
        first.getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const holidays =
        getJapaneseHolidays(
            year
        );


    for (
        let i = 0;
        i < 42;
        i++
    ) {

        const dayNumber =
            i - startDay + 1;


        const date =
            new Date(
                year,
                month,
                dayNumber
            );


        const thisMonth =
            dayNumber >= 1
            && dayNumber <= daysInMonth;


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day-cell";


        if (!thisMonth) {

            cell.classList.add(
                "other-month"
            );
        }


        if (
            dateKey(date)
            === dateKey(new Date())
        ) {

            cell.classList.add(
                "today"
            );
        }


        /* 日付 */

        const dayText =
            document.createElement(
                "div"
            );


        dayText.className =
            "day-number";


        dayText.textContent =
            date.getDate();


        if (
            date.getDay() === 0
            ||
            holidays[
                dateKey(date)
            ]
        ) {

            dayText.classList.add(
                "holiday"
            );

        } else if (
            date.getDay() === 6
        ) {

            dayText.style.color =
                "#1976d2";
        }


        cell.appendChild(
            dayText
        );


        /* 祝日 */

        if (
            thisMonth
            &&
            holidays[
                dateKey(date)
            ]
        ) {

            const holiday =
                document.createElement(
                    "div"
                );


            holiday.className =
                "schedule-preview holiday";


            holiday.textContent =
                holidays[
                    dateKey(date)
                ];


            cell.appendChild(
                holiday
            );
        }


        /* 予定＋Todo */

        const items =
            getItemsForDate(
                date
            );


        /*
           4件までは4件表示

           5件以上なら
           3件＋他○件
        */

        const displayCount =
            items.length >= 5
                ? 3
                : Math.min(
                    items.length,
                    4
                );


        for (
            let j = 0;
            j < displayCount;
            j++
        ) {

            const data =
                items[j];


            const text =
                document.createElement(
                    "div"
                );


            if (
                data.type ===
                "schedule"
            ) {

                text.className =
                    "schedule-preview";


                /*
                   予定の左に○は付けない
                */

                text.textContent =
                    data.item.title;

            } else {

                text.className =
                    "todo-preview";


                const completed =
                    isTodoCompleted(
                        data.item,
                        date
                    );


                text.textContent =
                    (
                        completed
                            ? "✓ "
                            : "□ "
                    )
                    + data.item.title;


                if (completed) {

                    text.classList.add(
                        "completed"
                    );
                }
            }


            cell.appendChild(
                text
            );
        }


        /* 5件以上 */

        if (
            items.length >= 5
        ) {

            const more =
                document.createElement(
                    "div"
                );


            more.className =
                "more";


            more.textContent =
                `…他${items.length - displayCount}件`;


            cell.appendChild(
                more
            );
        }


        /* =================================================
           日付クリック
        ================================================= */

        cell.addEventListener(
            "click",
            () => {

                if (
                    suppressNextClick
                ) {

                    return;
                }


                suppressNextClick =
                    true;


                setTimeout(
                    () => {
                        suppressNextClick =
                            false;
                    },
                    250
                );


                selectedDate =
                    new Date(date);


                showDateModal();
            }
        );


        calendar.appendChild(
            cell
        );
    }
}


/* =====================================================
   Todo完了状態
===================================================== */

function isTodoCompleted(
    todo,
    date
) {

    if (
        todo.repeat === "NONE"
    ) {

        return !!todo.completed;
    }


    return (
        todo.completedDates
        || []
    ).includes(
        dateKey(date)
    );
}


/* =====================================================
   Todo完了変更
===================================================== */

function setTodoCompleted(
    todo,
    date,
    completed
) {

    if (
        todo.repeat === "NONE"
    ) {

        todo.completed =
            completed;

        return;
    }


    if (
        !todo.completedDates
    ) {

        todo.completedDates =
            [];
    }


    const key =
        dateKey(date);


    const index =
        todo.completedDates.indexOf(
            key
        );


    if (
        completed
        &&
        index === -1
    ) {

        todo.completedDates.push(
            key
        );

    } else if (
        !completed
        &&
        index !== -1
    ) {

        todo.completedDates.splice(
            index,
            1
        );
    }
}

/* =====================================================
   予定編集
===================================================== */

function editSchedule(
    index
) {

    const schedule =
        schedules[index];


    const title =
        prompt(
            "予定を編集",
            schedule.title
        );


    if (
        title === null
    ) {

        return;
    }


    if (
        !title.trim()
    ) {

        return;
    }


    schedule.title =
        title.trim();


    const repeat =
        prompt(
            "繰り返しを入力してください\n"
            + "NONE / DAILY / WEEKLY / MONTHLY",
            schedule.repeat
        );


    if (
        repeat
        &&
        [
            "NONE",
            "DAILY",
            "WEEKLY",
            "MONTHLY"
        ].includes(
            repeat.toUpperCase()
        )
    ) {

        schedule.repeat =
            repeat.toUpperCase();
    }


    saveData();


    showDateModal();


    renderCalendar();
}

/* =====================================================
   左右スワイプ
===================================================== */

let touchStartX =
    0;

let touchStartY =
    0;

let suppressNextClick =
    false;


const calendar =
    document.getElementById(
        "calendar"
    );


calendar.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event
                .changedTouches[0]
                .screenX;


        touchStartY =
            event
                .changedTouches[0]
                .screenY;

    },
    {
        passive: true
    }
);


calendar.addEventListener(
    "touchend",
    event => {

        const endX =
            event
                .changedTouches[0]
                .screenX;


        const endY =
            event
                .changedTouches[0]
                .screenY;


        const dx =
            endX
            - touchStartX;


        const dy =
            endY
            - touchStartY;


        /*
           横方向のスワイプだけ
        */

        if (
            Math.abs(dx) > 60
            &&
            Math.abs(dx)
                > Math.abs(dy)
        ) {

            /*
               スワイプ後の
               クリックイベントを無効化
            */

            suppressNextClick =
                true;


            setTimeout(
                () => {

                    suppressNextClick =
                        false;

                },
                400
            );


            if (
                dx < 0
            ) {

                /* 左スワイプ → 次月 */

                currentMonth =
                    new Date(
                        currentMonth
                            .getFullYear(),

                        currentMonth
                            .getMonth()
                            + 1,

                        1
                    );

            } else {

                /* 右スワイプ → 前月 */

                currentMonth =
                    new Date(
                        currentMonth
                            .getFullYear(),

                        currentMonth
                            .getMonth()
                            - 1,

                        1
                    );
            }


            renderCalendar();
        }

    },
    {
        passive: true
    }
);
